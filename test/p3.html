<!doctype html>
<html lang="zh-Hant-TWn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>選擇偷渡客</title>
    <link rel="stylesheet" href="./CSS/p3.css" />
    <script src="./JS/p3.js" defer></script>
  </head>
  <body>
    <div class="text">
      <img src="./IMG/p3_text.png" />
    </div>
    <div class="opt">
      <div class="opta">
        <input type="radio" name="p22" id="opta" value="a" />
        <label for="opta">
          <img src="./IMG/p3_opta.gif" class="gifa" />
          <img src="./IMG/p3_opta_text.png" class="texta" />
          <div class="wave">
            <div class="wave-inner">
              <img src="./IMG/p2.wave.png" />
              <img src="./IMG/p2.wave.png" />
              <img src="./IMG/p2.wave.png" />
              <img src="./IMG/p2.wave.png" />
            </div>
          </div>
        </label>
      </div>
      <div class="optb">
        <input type="radio" name="p22" id="optb" value="b" />
        <label for="optb">
          <img src="./IMG/p3_optb.gif" class="gifb" />
          <img src="./IMG/p3_optb_text.png" class="textb" />
          <div class="wave">
            <div class="wave-inner">
              <img src="./IMG/p2.wave.png" />
              <img src="./IMG/p2.wave.png" />
              <img src="./IMG/p2.wave.png" />
              <img src="./IMG/p2.wave.png" />
            </div>
          </div>
        </label>
      </div>
      <div class="optc">
        <input type="radio" name="p22" id="optc" value="c" />
        <label for="optc">
          <img src="./IMG/p3_optc.gif" class="gifc" />
          <img src="./IMG/p3_optc_text.png" class="textc" />
          <div class="wave">
            <div class="wave-inner">
              <img src="./IMG/p2.wave.png" />
              <img src="./IMG/p2.wave.png" />
              <img src="./IMG/p2.wave.png" />
              <img src="./IMG/p2.wave.png" />
            </div>
          </div>
        </label>
      </div>
      <a href="./p4.html" class="next">
        <div class="nextbtn">
          <img src="./IMG/nextbtn_boat.png" class="nextboat" />
          <img src="./IMG/nextbtn.png" />
        </div>
      </a>
    </div>
    <div class="flowcont">
      <div class="flowboat">
        <img src="./IMG/flow_boat.png" class="flowboatimg" />
        <img src="./IMG/p3_flow_text.png" class="flowtext" />
      </div>
      <div class="flow">
        <img src="./IMG/flow.png" class="flowimg" />
      </div>
    </div>
    <div class="book">
      <img src="./IMG/book.png" alt="Book" />
    </div>

    <!-- 彈跳視窗與背景遮罩 -->
    <div class="modal-overlay">
      <div class="modal-content">
        <img src="＃" alt="Book Large" />
      </div>
    </div>
  </body>
</html>
